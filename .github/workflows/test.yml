
name: SunnyStudy CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate application files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required files
        run: |
          test -f app.js
          test -f index.html
          test -f styles.css
          test -f sw.js
          test -f manifest.json

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js

      - name: Validate manifest JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('Manifest JSON is valid')"

      - name: Report success
        run: echo "SunnyStudy static checks passed"
